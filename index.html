function tierClass(tier){ return 'tier-' + tier.replace(/[^A-Za-z]+/g, '-').replace(/^-|-$/g,''); }

function effectivePlan(){
  // Base PLAN months, plus per-month overrides (added/removed), plus extraMonths pulled later.
  const months = PLAN.map(m => {
    const ov = STATE.planOverrides[m.month] || {added:[], removed:[]};
    let keys = m.keys.filter(k => !ov.removed.includes(k));
    keys = keys.concat(ov.added.filter(k => !keys.includes(k)));
    return {month: m.month, keys};
  });
  STATE.extraMonths.forEach(em => months.push(em));
  return months;
}

function allPlannedKeys(){
  const s = new Set();
  effectivePlan().forEach(m => m.keys.forEach(k => s.add(k)));
  return s;
}

async function persistState(){
  STATE.lastUpdated = new Date().toISOString();
  localStorage.setItem('thestack_state_backup', JSON.stringify(STATE));
  try{
    const art = await claude.use('artifact');
    if(!art){ flashSave('Saved on this device only'); return; }
    // The artifact capability's publish() takes a whole new document (not a
    // path->content map -- that was the bug behind "refresh resets every
    // time": this call was silently failing every single time). Every open
    // view, this one included, reloads to whatever gets published here.
    await art.publish(buildPageHtml());
    flashSave('Saved');
  }catch(e){
    // Conflict (someone else's save landed first) is routine here -- every
    // view just reloads to the winner. No retry.
    flashSave('Saved on this device only');
  }
}

function flashSave(msg){

function fireConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['var(--accent)','var(--tier-strong)','var(--tier-book)','var(--tier-comfort)','var(--tier-hidden)','var(--tier-stretch)','var(--good)'];
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;';
  for(let i = 0; i < 90; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 6;
    const isCircle = Math.random() < 0.4;
    piece.style.left = (Math.random() * 100) + 'vw';
    piece.style.width = size + 'px';
    piece.style.height = (isCircle ? size : size * 2.2) + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    if(isCircle) piece.style.borderRadius = '50%';
    piece.style.setProperty('--drift', (Math.random() * 140 - 70) + 'px');
    piece.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4200);
}

// same genre->tone logic elsewhere), buzz picks how bold a pour within that
// family -- low buzz gets something quieter and more under-the-radar (a
// "hidden gem" bottle to match), high buzz gets the showstopper. Varietal/
// style only, deliberately -- no invented producer or vintage, since there's

const WINE_PAIRINGS = {
  'Contemporary Romance': {low: 'Vinho Verde', medium: 'Rosé', high: 'Sparkling Rosé'},
  'Contemporary Romance (small-town/sports)': {low: 'Dry Riesling', medium: 'Sauvignon Blanc', high: 'Chardonnay'},

  'Romantasy': {low: "Moscato d'Asti", medium: 'Sparkling Rosé', high: 'Rosé Champagne'},

function winePairingFor(book){
  const byGenre = WINE_PAIRINGS[book.g];
  if(!byGenre) return null;
  return byGenre[book.buzz] || byGenre.medium;
}

// Tasting-character phrase per varietal, independent of which genre/buzz
// combination landed on it -- so the "why it pairs" sentence stays accurate
// no matter which of the 24 varietals in WINE_PAIRINGS comes up. Kept as

function winePairingReason(book){

    "Moscato d'Asti": 'sweet, low-alcohol, peachy fizz',
    'Rosé Champagne': 'elegant pink bubbles with a red-berry edge',
  };
  const WINE_BUZZ_FRAME = {
    low: 'something quieter and under-the-radar, to match a lower-buzz pick',
    medium: 'a reliable, crowd-pleasing glass for a well-talked-about read',
    high: 'the kind of showstopper pour a high-buzz pick deserves',
  };
  const wine = winePairingFor(book);
  if(!wine) return null;
  const note = WINE_NOTES[wine] || 'a solid pick for the genre';
  const frame = WINE_BUZZ_FRAME[book.buzz] || WINE_BUZZ_FRAME.medium;
  return {wine, text: `${note} — ${frame}.`};

const DOWNLOAD_PASSWORD = 'HenryHenryHenry!!!';

async function downloadMyData(){
  const input = document.getElementById('downloadPassword');
  const errorEl = document.getElementById('downloadError');
  if(input.value !== DOWNLOAD_PASSWORD){
    errorEl.textContent = 'Incorrect password.';
    return;
  }
  errorEl.textContent = '';
  const backup = {exportedAt: new Date().toISOString(), STATE, CATALOG, PLAN};
  const json = JSON.stringify(backup, null, 2);
  const filename = 'the-stack-backup-' + new Date().toISOString().slice(0,10) + '.json';

  // A plain <a download> link is inert inside the claude.ai artifact viewer --
  // downloads only reach the viewer through this capability, which shows them
  // a real confirmation prompt. Falls back to a normal browser download when
  // the capability isn't there at all (e.g. once this page is loaded straight
  // from GitHub, where window.claude doesn't exist).
  try{
    const downloads = (typeof window !== 'undefined' && window.claude && window.claude.use)
      ? await window.claude.use('downloads') : null;
    if(downloads){
      await downloads.save({filename, data: json});
      input.value = '';
      return;
    }
  }catch(e){
    if(e && e.code === 'declined') return; // she said no in the prompt -- don't fall back behind her back
  }

  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  input.value = '';
}

function addBook(title, author, genre, buzz, wishlist){
  const key = title.toLowerCase() + '||' + author.toLowerCase();
  if(CATALOG_BY_KEY[key]) return {ok: false, error: 'That book is already on your shelf.'};
  const tone = GENRE_TONE[genre];
  const book = {k: key, t: title, a: author, g: genre, tone, tier: 'Solid Pick', buzz, score: 50};
  CATALOG.push(book);
  CATALOG_BY_KEY[key] = book;
  if(wishlist) STATE.wishlist[key] = true;
  renderAll(); persistState();
  return {ok: true, book};
}

  const result = addBook(title, author, genre, buzz, wishlist);
  if(!result.ok){ errorEl.textContent = result.error; return; }

function markDNF(key){
  // Started it, chose not to finish -- distinct from "read" (never mark this
  // as finished) and from "skipped" (which means never started). Excluded
  // from future picks like read/skipped are, but unlike a plain skip, rating
  // a DNF here feeds the same genre/author affinity math a finished book's
  // rating does (see recomputeLiveCatalog) -- so it actually counts against
  // more of the same, not just quietly vanishes.
  STATE.dnf[key] = new Date().toISOString();
  delete STATE.reading[key];
  delete STATE.skipped[key];
  renderAll(); persistState();

function initialsOf(title){
  const words = title.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
  if(words.length === 0) return '?';
  if(words.length === 1) return words[0].slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

function ensureCoverLoaded(book){
  // Called for the currently-reading book plus every book shown in a plan
  // month -- the per-book coverCache guard below means each title is only
  // ever fetched once, so this stays cheap even called from a render loop.
  // The claude.ai artifact sandbox blocks fetches to non-allowlisted hosts, so
  // this silently no-ops there and falls back to the cover-fallback monogram;
  // it resolves normally once this page is loaded from GitHub in a real browser.
  if(!book || coverCache[book.k] !== undefined) return;
  coverCache[book.k] = 'pending';
  const q = 'title=' + encodeURIComponent(book.t) + '&author=' + encodeURIComponent(book.a);
  fetch('https://openlibrary.org/search.json?' + q + '&limit=1&fields=cover_i')
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      const id = data && data.docs && data.docs[0] && data.docs[0].cover_i;
      coverCache[book.k] = id ? ('https://covers.openlibrary.org/b/id/' + id + '-M.jpg') : null;
      renderOverview();
      renderPlan();
    })
    .catch(() => { coverCache[book.k] = null; renderOverview(); renderPlan(); });
}

function addToPlan(key){
  const months = effectivePlan();
  const target = months[months.length-1];
  if(!STATE.planOverrides[target.month]) STATE.planOverrides[target.month] = {added:[], removed:[]};
  if(!target.keys.includes(key)) STATE.planOverrides[target.month].added.push(key);
  delete STATE.skipped[key];
  renderAll(); persistState();
}

function findReplacement(removedBook){
  // Exclude the book being swapped out too -- at this point it's already been
  // taken out of the month's plan, so allPlannedKeys() no longer counts it as
  // "planned" and it would otherwise be eligible to replace itself (which is
  // what caused the old "just moves to the bottom" bug).
  const excluded = new Set([removedBook.k, ...allPlannedKeys(), ...Object.keys(STATE.read), ...Object.keys(STATE.skipped), ...Object.keys(STATE.dnf), ...Object.keys(STATE.wishlist)]);
  const pool = CATALOG.filter(b => !excluded.has(b.k));
  if(pool.length === 0) return null;
  const byScoreDesc = (a,b) => liveScore(b.k) - liveScore(a.k);
  const removedTier = liveTier(removedBook.k);
  const sameTier = pool.filter(b => liveTier(b.k) === removedTier).sort(byScoreDesc);
  if(sameTier.length) return sameTier[0];
  const sameGenre = pool.filter(b => b.g === removedBook.g).sort(byScoreDesc);
  if(sameGenre.length) return sameGenre[0];
  return pool.sort(byScoreDesc)[0];
}

function removeFromPlan(key, month){
  const removedBook = CATALOG_BY_KEY[key];
  if(!STATE.planOverrides[month]) STATE.planOverrides[month] = {added:[], removed:[]};
  if(!STATE.planOverrides[month].removed.includes(key)) STATE.planOverrides[month].removed.push(key);
  STATE.planOverrides[month].added = STATE.planOverrides[month].added.filter(k => k !== key);
  const replacement = removedBook ? findReplacement(removedBook) : null;
  if(replacement){
    STATE.planOverrides[month].added.push(replacement.k);
  }
  renderAll(); persistState();
}

function addNextMonth(){
  const months = effectivePlan();
  const nextMonthNum = Math.max(...months.map(m=>m.month)) + 1;
  const excluded = new Set([...allPlannedKeys(), ...Object.keys(STATE.read), ...Object.keys(STATE.skipped), ...Object.keys(STATE.dnf), ...Object.keys(STATE.wishlist)]);
  const available = CATALOG.filter(b => !excluded.has(b.k));
  const byTier = {};
  available.forEach(b => { (byTier[liveTier(b.k)] = byTier[liveTier(b.k)] || []).push(b); });
  Object.values(byTier).forEach(list => list.sort((a,b) => liveScore(b.k) - liveScore(a.k)));

  const used = new Set();
  function take(tier, n, avoidGenres){
    const picked = [];
    const pool = byTier[tier] || [];
    for(const b of pool){
      if(picked.length >= n) break;
      if(used.has(b.k) || avoidGenres.has(b.g)) continue;
      picked.push(b); used.add(b.k);
    }
    for(const b of pool){
      if(picked.length >= n) break;
      if(used.has(b.k)) continue;
      picked.push(b); used.add(b.k);
    }
    return picked;
  }

  const genresThisMonth = new Set();
  let picks = [];
  [["Auto-Buy Author",1], ["Strong Match",2], ["Book Club Buzz",2], ["Comfort Read",1], ["Hidden Gem",1]].forEach(([tier,n]) => {
    const got = take(tier, n, genresThisMonth);
    got.forEach(b => genresThisMonth.add(b.g));
    picks = picks.concat(got);
  });
  if(nextMonthNum % 2 === 0){
    picks = picks.concat(take("Stretch Pick", 1, genresThisMonth));
  }
  // Backfill from Solid Pick if any tier came up short (e.g. Auto-Buy Author
  // pool runs dry) so a queued month never comes back thinner than expected.
  if(picks.length < 7){
    picks = picks.concat(take("Solid Pick", 7 - picks.length, genresThisMonth));
  }

  STATE.extraMonths.push({month: nextMonthNum, keys: picks.map(b=>b.k)});
  renderAll(); persistState();
}

function bookTagsHTML(b){

// Genuine, tier-based rationale for a still-unread pick, citing the same
// signals recomputeLiveCatalog() actually used (author familiarity, genre,
// buzz) rather than generic filler -- so it stays accurate as ratings shift
// which tier a book lands in.
function whyChosenText(b){
  const tier = liveTier(b.k);
  const astat = BASELINE.author_stats[b.a];
  const authorAvg = astat && astat.w_count ? (astat.w_sum / astat.w_count).toFixed(1) : null;
  const authorClause = astat ? ` You've read ${astat.n} ${escHtml(b.a)} book${astat.n === 1 ? '' : 's'} before, averaging ${authorAvg}★.` : '';
  const buzzClause = b.buzz === 'high' ? " It's riding high buzz right now."
    : b.buzz === 'low' ? " It's a lower-buzz, under-the-radar pick." : '';
  switch(tier){
    case 'Auto-Buy Author':
      return `${escHtml(b.a)} is one of your auto-buy authors.${authorClause} It also matches ${escHtml(b.g)}, one of your strongest genres.${buzzClause}`;
    case 'Strong Match':
      return `${escHtml(b.g)} is one of your strongest genres, and this checks the boxes on tone and author familiarity.${authorClause}${buzzClause}`;
    case 'Book Club Buzz':
      return `A high-buzz pick in ${escHtml(b.g)}.${authorClause}${buzzClause}`;
    case 'Comfort Read':
      return `A comfort-read pick — ${escHtml(b.g)} tends to be reliable for you.${authorClause}${buzzClause}`;
    case 'Hidden Gem':
      return `A hidden gem: lower buzz, but the genre and author signals still line up in ${escHtml(b.g)}.${authorClause}`;
    case 'Stretch Pick':
      return `A stretch pick — a bit outside your usual comfort zone, but worth a try.${authorClause}${buzzClause}`;
    default:
      return `A solid match on ${escHtml(b.g)}.${authorClause}${buzzClause}`;
  }
}

// Hybrid "books similar you've read": prefers real titles from STATE.read
// that share this book's genre or author, then always adds the aggregate
// Goodreads author-level fact (when one exists) as extra context -- since
// STATE.read only has a handful of titles so far, that fallback is often
// the only concrete thing to show.
function similarBooksHTML(b){
  const read = Object.keys(STATE.read).map(k => CATALOG_BY_KEY[k]).filter(x => x && x.k !== b.k);
  const matches = read.filter(x => x.g === b.g || x.a === b.a);
  matches.sort((x, y) => {
    const xa = x.a === b.a ? 1 : 0, ya = y.a === b.a ? 1 : 0;
    if(xa !== ya) return ya - xa;
    return (STATE.ratings[y.k] || 0) - (STATE.ratings[x.k] || 0);
  });
  const top = matches.slice(0, 2);
  const chipsHTML = top.length ? `<div class="similar-chip-row">
    ${top.map(m => `<div class="similar-chip"><span><span class="t">${escHtml(m.t)}</span> &middot; <span class="a">${escHtml(m.a)}</span></span><span class="stars">${STATE.ratings[m.k] ? '★'.repeat(STATE.ratings[m.k]) : ''}</span></div>`).join('')}
  </div>` : '';

  const astat = BASELINE.author_stats[b.a];
  let authorNote = '';
  if(astat && astat.w_count){
    const avg = (astat.w_sum / astat.w_count).toFixed(1);
    const verb = top.length ? "You've also read" : "You've read";
    authorNote = `<div class="similar-note"${top.length ? ' style="margin-top:0.4rem;"' : ''}>${verb} ${astat.n} other ${escHtml(b.a)} book${astat.n === 1 ? '' : 's'}, averaging ${avg}★.</div>`;
  }

  if(!top.length && !authorNote){
    return `<div class="similar-note">You haven't read anything quite like this on the site yet — as your ratings grow, this will fill in.</div>`;
  }
  return chipsHTML + authorNote;
}

const READING_GOAL = 50;

function gaugeNeedleColor(pct){
  // Same red -> amber -> green spectrum as the arc's fixed gradient, expressed
  // as color-mix() against the live theme tokens so the needle always matches
  // whatever the current light/dark palette actually is, with no color math
  // (or theme detection) needed here.
  if(pct <= 50) return `color-mix(in srgb, var(--tier-auto), var(--warn) ${Math.round(pct * 2)}%)`;
  return `color-mix(in srgb, var(--warn), var(--good) ${Math.round((pct - 50) * 2)}%)`;
}

function renderGaugeSVG(count, goal){
  const pct = Math.min(100, Math.round(100 * count / goal));
  const angle = -90 + (pct / 100) * 180;
  const needleColor = gaugeNeedleColor(pct);
  return `<svg viewBox="0 0 200 112" class="gauge-svg">
    <defs>
      <linearGradient id="gaugeArcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:var(--tier-auto)"></stop>
        <stop offset="50%" style="stop-color:var(--warn)"></stop>
        <stop offset="100%" style="stop-color:var(--good)"></stop>
      </linearGradient>
    </defs>
    <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#gaugeArcGradient)" stroke-width="14" stroke-linecap="round"></path>
    <g class="gauge-needle" transform="rotate(${angle} 100 100)">
      <line x1="100" y1="100" x2="100" y2="32" stroke-width="4" stroke-linecap="round" style="stroke:${needleColor}"></line>
    </g>
    <circle cx="100" cy="100" r="7" style="fill:${needleColor}"></circle>
  </svg>`;
}

// Renders one month's plan card, including cover art per book and a
// "Why this pick?" panel (rationale + wine pairing + similar reads) on
// every book that's still an active recommendation. Shared by both the
// dedicated Plan tab and the "This Month's Plan" copy on Overview.
function monthCardHTML(m){
  const books = m.keys.map(k => CATALOG_BY_KEY[k]).filter(Boolean);
  const doneCount = books.filter(b => STATE.read[b.k]).length;
  let html = `<div class="month-card">
    <div class="month-head"><span>Month ${m.month}</span><span>${doneCount} / ${books.length} read</span></div>`;
  if(books.length === 0){
    html += `<div class="empty-note">No books queued yet.</div>`;
  }
  books.forEach(b => {
    ensureCoverLoaded(b);
    const cover = coverCache[b.k];
    const coverImgHTML = (cover && cover !== 'pending')
      ? `<img class="cover-img" src="${escHtml(cover)}" alt="" onerror="this.style.display='none'">`
      : '';
    const coverHTML = `<div class="cover-wrap"><div class="cover-fallback">${escHtml(initialsOf(b.t))}</div>${coverImgHTML}</div>`;

    const isDone = !!STATE.read[b.k];
    const isReading = !isDone && !!STATE.reading[b.k];
    const isDnf = !isDone && !isReading && !!STATE.dnf[b.k];
    const readingTag = isReading ? `<span class="tag reading">Currently Reading</span>`
      : isDnf ? `<span class="tag" style="background:var(--text-dim); color:#fff;">Didn't Finish</span>` : '';
    const actions = isDone ? `` : isReading
      ? `<button class="btn small primary" onclick="markRead('${escKey(b.k)}')">Mark finished</button>
         <button class="btn small" onclick="markDNF('${escKey(b.k)}')">Didn't finish</button>
         <button class="btn small" onclick="unmarkReading('${escKey(b.k)}')">Stop reading</button>`
      : isDnf
      ? `<button class="btn small" onclick="unmarkDNF('${escKey(b.k)}')">Undo</button>
         <button class="btn small" onclick="removeFromPlan('${escKey(b.k)}', ${m.month})">Replace in plan</button>`
      : `<button class="btn small" onclick="markReading('${escKey(b.k)}')">Start reading</button>
         <button class="btn small" onclick="removeFromPlan('${escKey(b.k)}', ${m.month})">Swap out</button>`;
    let ratingHTML = '';
    if(isDone || isDnf){
      if(needsRating(b.k)) ratingHTML = ratingPromptHTML(b.k);
      else if(needsFeedback(b.k)) ratingHTML = feedbackPromptHTML(b.k);
      else if(STATE.ratings[b.k] !== undefined) ratingHTML = `<div class="rating-prompt"><span class="rated-stars" onclick="unrateBook('${escKey(b.k)}')" title="Click to re-rate">${starRatingHTML(b.k, STATE.ratings[b.k])}</span></div>`;
    }
    const whyHTML = (!isDone && !isDnf) ? whyPickHTML(b) : '';
    html += `<div class="book-row ${isDone?'done':''} ${isReading?'reading':''} ${isDnf?'dnf':''}">
      <div class="checkbox ${isDone?'checked':''}" onclick="${isDone?`unmarkRead('${escKey(b.k)}')`:`markRead('${escKey(b.k)}')`}">${isDone?'&#10003;':''}</div>
      ${coverHTML}
      <div class="book-main">
        <div class="book-title">${escHtml(b.t)}</div>
        <div class="book-author">${escHtml(b.a)}</div>
        <div class="tags">${readingTag}${bookTagsHTML(b)}</div>
        ${ratingHTML}
        ${whyHTML}
      </div>
      <div class="row-actions">
        ${actions}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function pickerPool(){
  const excluded = new Set([...Object.keys(STATE.read), ...Object.keys(STATE.skipped), ...Object.keys(STATE.dnf), ...Object.keys(STATE.wishlist)]);
  return CATALOG.filter(b => {
    if(excluded.has(b.k)) return false;
    if(pickerFilters.tier && liveTier(b.k) !== pickerFilters.tier) return false;
    if(pickerFilters.genre && b.g !== pickerFilters.genre) return false;
    if(pickerFilters.buzz && b.buzz !== pickerFilters.buzz) return false;
    return true;
  });
}

function surpriseMe(){
  const pool = pickerPool();
  if(pool.length === 0){ currentPick = null; renderPicker(); return; }
  currentPick = pool[Math.floor(Math.random() * pool.length)];
  renderPicker();
}

function renderPicker(){
  const tiers = [...new Set(CATALOG.map(b=>b.tier))].sort();
  const genres = [...new Set(CATALOG.map(b=>b.g))].sort();
  const buzzes = ['high','medium','low'];
  const pool = pickerPool();

  let resultHtml = `<div class="empty-note">Set your filters (or leave them open) and hit "Surprise me" to get a pick.</div>`;
  if(currentPick && needsRating(currentPick.k)){
    const b = currentPick;
    resultHtml = `<div class="pick-result">
      <div class="book-title">${escHtml(b.t)}</div>
      <div class="book-author" style="color:var(--text-dim)">${escHtml(b.a)}</div>
      <div class="tags">${bookTagsHTML(b)}</div>
      <div class="pick-actions" style="justify-content:center;">${ratingPromptHTML(b.k)}</div>
    </div>`;
  } else if(currentPick && pool.some(b=>b.k===currentPick.k)){
    const b = currentPick;
    resultHtml = `<div class="pick-result">
      <div class="book-title">${escHtml(b.t)}</div>
      <div class="book-author" style="color:var(--text-dim)">${escHtml(b.a)}</div>
      <div class="tags">${bookTagsHTML(b)}</div>

      </div>
    </div>`;
  } else if(pool.length === 0){
    resultHtml = `<div class="empty-note">No unread, unskipped books match those filters right now.</div>`;
  }

  document.getElementById('tab-picker').innerHTML = `
    <h2 class="section-title">Pick My Next Book</h2>

function renderBrowseBody(){
  let rows = CATALOG.slice();
  const q = browseSearch.trim().toLowerCase();
  if(q) rows = rows.filter(b => b.t.toLowerCase().includes(q) || b.a.toLowerCase().includes(q));
  const colVal = (b, col) => (col === 'score' || col === 'tier') ? (col === 'score' ? liveScore(b.k) : liveTier(b.k)) : b[col];
  rows.sort((x,y) => {
    const a = colVal(x, browseSort.col), b = colVal(y, browseSort.col);
    if(typeof a === 'number') return (a-b) * browseSort.dir;
    return String(a).localeCompare(String(b)) * browseSort.dir;
  });
  document.getElementById('browseBody').innerHTML = rows.map(b => {
    const isDone = !!STATE.read[b.k];
    const isSkipped = !!STATE.skipped[b.k];
    const isDnf = !!STATE.dnf[b.k];
    const isReading = !!STATE.reading[b.k];
    const isWishlist = !!STATE.wishlist[b.k];
    const status = isDone ? '&#10003; read' : isDnf ? 'DNF' : isReading ? 'reading' : isWishlist ? 'wishlist' : isSkipped ? 'skipped' : '&mdash;';

      <td>${b.buzz}</td><td>${score}</td><td>${status}</td>
    </tr>`;
  }).join('');
}

function feedbackWeight(key){
  // "Want more/less like this?" scales how hard that one rating counts
  // toward genre/author/tone affinity -- a nudge on top of the star rating
  // itself, for when the rating alone doesn't capture "yes but I want more
  // specifically like THIS" or the reverse.
  const fb = STATE.feedback[key];
  if(!fb || !fb.moreLikeThis) return 1;
  return fb.moreLikeThis === 1 ? 1.5 : fb.moreLikeThis === -1 ? 0.5 : 1;
}

function recomputeLiveCatalog(){
  const NEW_W = BASELINE.new_rating_weight; // every rating she enters now is "current" by definition
  const overallAvgBase = BASELINE.overall;
  const genreBase = BASELINE.genre_stats;
  const authorBase = BASELINE.author_stats;

  // 1. Fold every rating she's given into the baseline aggregates.
  const genreAgg = {}; // genre -> {w_count, w_sum}
  Object.keys(genreBase).forEach(g => { genreAgg[g] = {w_count: genreBase[g].w_count, w_sum: genreBase[g].w_sum}; });
  const authorAgg = {}; // author -> {n, w_count, w_sum}
  Object.keys(authorBase).forEach(a => { authorAgg[a] = {n: authorBase[a].n, w_count: authorBase[a].w_count, w_sum: authorBase[a].w_sum}; });
  // Personalized tone affinity, learned the same way genre affinity is --
  // except there's no baseline prior for it (the 5-year Goodreads history
  // has no per-book tone tags), so it starts empty and only kicks in once
  // she's answered the "did the vibe work?" follow-up for a given tone at
  // least once. Until then that tone falls back to the flat manual dial.
  const toneAgg = {}; // tone -> {w_count, w_sum}
  let overallW = overallAvgBase.w_count, overallSum = overallAvgBase.w_sum;

  Object.entries(STATE.ratings).forEach(([key, rating]) => {
    const b = CATALOG_BY_KEY[key];
    if(!b) return;
    const w = NEW_W * feedbackWeight(key);
    if(!genreAgg[b.g]) genreAgg[b.g] = {w_count:0, w_sum:0};
    genreAgg[b.g].w_count += w; genreAgg[b.g].w_sum += w * rating;
    if(!authorAgg[b.a]) authorAgg[b.a] = {n:0, w_count:0, w_sum:0};
    authorAgg[b.a].n += 1; authorAgg[b.a].w_count += w; authorAgg[b.a].w_sum += w * rating;
    overallW += w; overallSum += w * rating;
  });

  Object.entries(STATE.feedback).forEach(([key, fb]) => {
    if(fb.toneFit === undefined) return;
    const b = CATALOG_BY_KEY[key];
    if(!b) return;
    const w = NEW_W * feedbackWeight(key);
    if(!toneAgg[b.tone]) toneAgg[b.tone] = {w_count:0, w_sum:0};
    toneAgg[b.tone].w_count += w;
    toneAgg[b.tone].w_sum += w * fb.toneFit;
  });

  const overallAvg = overallW ? overallSum / overallW : 4.0;
  const genreStats = {};
  Object.keys(genreAgg).forEach(g => {
    genreStats[g] = genreAgg[g].w_count ? genreAgg[g].w_sum / genreAgg[g].w_count : overallAvg;
  });
  // Genre "volume" share needs a shared denominator across all genres.
  const totalGenreWeight = Object.values(genreAgg).reduce((s,g) => s + g.w_count, 0);

  // 2. Raw taste-fit signal per book, same formula as buzz_and_score.py.
  //    Only books still in play (not read, not skipped) get rescored --
  //    finished/skipped books keep their last-known score, which no longer
  //    matters for ranking anyway.
  const active = CATALOG.filter(b => !STATE.read[b.k] && !STATE.skipped[b.k] && !STATE.dnf[b.k]);
  const raw = {};
  const tierRaw = {}; // genre+author only -- see step 4, kept separate from buzz/tone
  active.forEach(b => {
    let r = 0;
    const gAvg = genreStats[b.g];
    if(gAvg !== undefined){
      r += (gAvg - overallAvg) * 1.0;
      r += (genreAgg[b.g].w_count / totalGenreWeight) * 1.4;
    }
    r += BASELINE.genre_manual_adjust[b.g] || 0;
    const a = authorAgg[b.a];
    if(a && a.n >= 1){
      // Author familiarity now scales smoothly with how many of her books
      // you've read, instead of jumping from 0 to a flat bonus at n=2. A
      // single prior read still counts (partial signal, less confidence);
      // familiarity reaches full weight at author_familiarity_full_n (5)
      // books read, same as it effectively did before for prolific authors.
      const aAvg = a.w_sum / a.w_count;
      const familiarity = Math.min(a.n, BASELINE.author_familiarity_full_n) / BASELINE.author_familiarity_full_n;
      r += ((aAvg - overallAvg) * 0.6 + 0.5) * familiarity;
    }
    tierRaw[b.k] = r;
    // Buzz and tone dials, same +/-0.65 scale as the manual genre dial above
    // (calibrated 2026-08-26, at Courtney's request), so either one can move
    // a book a full tier on its own but can't single-handedly overwhelm the
    // genre/author signal. Added AFTER tierRaw is captured, on purpose:
    // buzz varies book-to-book within a genre, so folding it into the same
    // score used for genre-relative percentile (step 4) would let it eat its
    // own tail -- e.g. Hidden Gem specifically wants low-buzz books that
    // still rank well in-genre, and a buzz penalty baked into that same
    // ranking would make "low buzz" nearly self-disqualifying. Tone doesn't
    // have this problem (it's a 1:1 function of genre in this data, so it
    // shifts every book in a genre by the same amount) but is excluded here
    // too for the same reason, to keep tier gates purely genre+author based.
    r += BASELINE.buzz_dial[b.buzz] || 0;
    // Personalized tone affinity (from the "did the vibe work?" follow-up)
    // overrides the flat manual dial once there's real signal for this tone;
    // falls back to the dial otherwise, same fallback pattern genre/author
    // affinity already uses when there's no data yet.
    const tAgg = toneAgg[b.tone];
    if(tAgg && tAgg.w_count > 0){
      const tAvg = tAgg.w_sum / tAgg.w_count;
      r += (tAvg - overallAvg) * 0.6;
    } else {
      r += BASELINE.tone_dial[b.tone] || 0;
    }
    raw[b.k] = r;
  });

  // 3. Percentile-stretch to a 40-98 "match score" across the active pool.
  const ranked = [...active].sort((x,y) => raw[x.k] - raw[y.k]);
  const n = ranked.length;
  const score = {};
  ranked.forEach((b, i) => {
    const pct = n > 1 ? i / (n - 1) : 1;
    score[b.k] = Math.round(40 + 58 * pct);
  });

  // 4. Genre-relative percentile (for tier gates) -- ranks each book only
  //    against other ACTIVE books of its own genre, so the manual dial and
  //    her finishing books over time never wipes out a genre's own mood
  //    tiers the way a whole-shelf ranking would.
  const byGenre = {};
  active.forEach(b => { (byGenre[b.g] = byGenre[b.g] || []).push(b); });
  const genrePct = {};
  Object.values(byGenre).forEach(list => {
    const sorted = [...list].sort((x,y) => tierRaw[x.k] - tierRaw[y.k]);
    const gn = sorted.length;
    sorted.forEach((b, i) => { genrePct[b.k] = gn > 1 ? i / (gn - 1) : 1; });
  });

  // 5. Mood tiers -- same priority order and thresholds as the offline
  //    pipeline's tier_pass1 / pass2.
  function tierOf(b){
    const a = authorAgg[b.a];
    if(a && a.n >= BASELINE.auto_buy_min_n && (a.w_sum / a.w_count) >= BASELINE.auto_buy_min_avg) return "Auto-Buy Author";
    if((b.buzz === "high" || b.buzz === "medium") && (b.g === "Book Club / Upmarket Fiction" || b.g === "Historical / Book-Club Fiction")) return "Book Club Buzz";
    if((b.g === "Contemporary Romance" || b.g === "Contemporary Romance (small-town/sports)") && genrePct[b.k] >= 0.5) return "Comfort Read";
    if(b.g === "Romantasy" || (b.g === "Contemporary Romance (small-town/sports)" && genrePct[b.k] < 0.5)) return "Stretch Pick";
    if(genrePct[b.k] >= 0.85) return "Strong Match";
    if(b.buzz === "low" && genrePct[b.k] >= 0.5) return "Hidden Gem";
    return "Solid Pick";
  }

  LIVE = {};
  active.forEach(b => { LIVE[b.k] = {score: score[b.k], tier: tierOf(b)}; });
  // Finished/skipped books: keep their frozen static values so Browse can
  // still show something sensible for them.
  CATALOG.forEach(b => { if(!LIVE[b.k]) LIVE[b.k] = {score: b.score, tier: b.tier}; });
}

function liveScore(k){ return (LIVE[k] || CATALOG_BY_KEY[k] || {}).score; }

function initSeedAndTabs(){
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('section.tab').forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    };
  });

  // A previous save may have fallen back to "this device only" (artifact
  // capability unavailable at that moment) -- prefer that local backup over
  // the published INITIAL_STATE if it's actually newer, so that edit isn't
  // silently lost on the next refresh.
  try{
    const backupRaw = localStorage.getItem('thestack_state_backup');
    if(backupRaw){
      const backup = JSON.parse(backupRaw);
      if(backup && backup.lastUpdated && (!STATE.lastUpdated || backup.lastUpdated > STATE.lastUpdated)){
        STATE = backup;
      }
    }
  }catch(e){}

  // One-time seed: if this key has never been touched (not reading, read, or
  // skipped), mark it currently-reading in memory so Overview shows it right
  // away. Deliberately NOT published from here -- a publish must only ever
  // follow a real viewer action, never happen on load -- so this re-applies
  // harmlessly on every load until her first real action (marking or rating
  // anything) bakes it into the next published version for good.
  if(SEED_READING_KEY && CATALOG_BY_KEY[SEED_READING_KEY] &&
     !STATE.reading[SEED_READING_KEY] && !STATE.read[SEED_READING_KEY] && !STATE.skipped[SEED_READING_KEY]){
    STATE.reading[SEED_READING_KEY] = new Date().toISOString();
  }

  // The catalog count baked into the static header/nav text goes stale the
  // moment a book is added by hand (Browse > Add a Book), so patch both spots
  // from the real CATALOG.length on load instead of re-editing this copy
  // every time the count changes.
  const headerCount = document.getElementById('catalogCountInHeader');
  if(headerCount) headerCount.textContent = CATALOG.length;
  const browseNavBtn = document.getElementById('browseNavBtn');
  if(browseNavBtn) browseNavBtn.textContent = 'Browse All ' + CATALOG.length;

  renderAll();
}
